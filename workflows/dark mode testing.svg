<svg baseProfile="full" height="1068px" version="1.1" width="230px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="id1" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="10" refY="5.0"><path d="M0,0 L10,5.0 L0,10 z" fill="#333333" /></marker></defs><rect fill="#ADD8E6" height="92" rx="5" ry="5" stroke="#000000" width="150" x="40" y="40" /><text fill="#000000" font-family="Arial" font-size="14.4px" stroke="none" text-anchor="middle" x="115.0" y="0"><tspan x="115.0" y="62.6">Use computer</tspan><tspan dy="18px" x="115.0">vision to</tspan><tspan dy="18px" x="115.0">generate cart</tspan><tspan dy="18px" x="115.0">list from video</tspan></text><rect fill="#ADD8E6" height="75" rx="5" ry="5" stroke="#000000" width="150" x="40" y="172" /><text fill="#000000" font-family="Arial" font-size="14.4px" stroke="none" text-anchor="middle" x="115.0" y="0"><tspan x="115.0" y="195.1">Log timestamp of</tspan><tspan dy="18px" x="115.0">last item added</tspan><tspan dy="18px" x="115.0">to cart</tspan></text><rect fill="#ADD8E6" height="92" rx="5" ry="5" stroke="#000000" width="150" x="40" y="287" /><text fill="#000000" font-family="Arial" font-size="14.4px" stroke="none" text-anchor="middle" x="115.0" y="0"><tspan x="115.0" y="309.6">Extract receipts</tspan><tspan dy="18px" x="115.0">and parse item</tspan><tspan dy="18px" x="115.0">list + timestamp</tspan><tspan dy="18px" x="115.0">(remove PII)</tspan></text><rect fill="#FFFFE0" height="92" rx="5" ry="5" stroke="#000000" width="150" x="40" y="419" /><text fill="#000000" font-family="Arial" font-size="14.4px" stroke="none" text-anchor="middle" x="115.0" y="0"><tspan x="115.0" y="441.6">Does any receipt</tspan><tspan dy="18px" x="115.0">timestamp and</tspan><tspan dy="18px" x="115.0">item list match</tspan><tspan dy="18px" x="115.0">the cart list?</tspan></text><rect fill="#ADD8E6" height="92" rx="5" ry="5" stroke="#000000" width="150" x="40" y="551" /><text fill="#000000" font-family="Arial" font-size="14.4px" stroke="none" text-anchor="middle" x="115.0" y="0"><tspan x="115.0" y="573.6">Run analytics to</tspan><tspan dy="18px" x="115.0">compare cart</tspan><tspan dy="18px" x="115.0">list vs. receipt</tspan><tspan dy="18px" x="115.0">list</tspan></text><rect fill="#ADD8E6" height="75" rx="5" ry="5" stroke="#000000" width="150" x="40" y="683" /><text fill="#000000" font-family="Arial" font-size="14.4px" stroke="none" text-anchor="middle" x="115.0" y="0"><tspan x="115.0" y="706.1">Measure accuracy</tspan><tspan dy="18px" x="115.0">and run</tspan><tspan dy="18px" x="115.0">diagnostics</tspan></text><rect fill="#ADD8E6" height="75" rx="5" ry="5" stroke="#000000" width="150" x="40" y="798" /><text fill="#000000" font-family="Arial" font-size="14.4px" stroke="none" text-anchor="middle" x="115.0" y="0"><tspan x="115.0" y="821.1">Try next receipt</tspan><tspan dy="18px" x="115.0">from the</tspan><tspan dy="18px" x="115.0">collection</tspan></text><rect fill="#FFFFE0" height="75" rx="5" ry="5" stroke="#000000" width="150" x="40" y="913" /><text fill="#000000" font-family="Arial" font-size="14.4px" stroke="none" text-anchor="middle" x="115.0" y="0"><tspan x="115.0" y="954.1">Testing complete</tspan></text><line marker-end="url(#id1)" stroke="#333333" stroke-width="2" x1="115.0" x2="115.0" y1="132" y2="172" /><line marker-end="url(#id1)" stroke="#333333" stroke-width="2" x1="115.0" x2="115.0" y1="247" y2="287" /><line marker-end="url(#id1)" stroke="#333333" stroke-width="2" x1="115.0" x2="115.0" y1="379" y2="419" /><line marker-end="url(#id1)" stroke="#333333" stroke-width="2" x1="115.0" x2="115.0" y1="511" y2="551" /><text fill="#000000" font-family="Arial" font-size="12px" x="120.0" y="526.0">Yes</text><line marker-end="url(#id1)" stroke="#333333" stroke-width="2" x1="115.0" x2="115.0" y1="511" y2="798" /><text fill="#000000" font-family="Arial" font-size="12px" x="120.0" y="649.5">No</text><line marker-end="url(#id1)" stroke="#333333" stroke-width="2" x1="115.0" x2="115.0" y1="643" y2="683" /><line marker-end="url(#id1)" stroke="#333333" stroke-width="2" x1="115.0" x2="115.0" y1="758" y2="913" /><line marker-end="url(#id1)" stroke="#333333" stroke-width="2" x1="115.0" x2="115.0" y1="798" y2="511" /></svg>